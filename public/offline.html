<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>모아홈 — 오프라인</title>
  <style>
    body { margin: 0; font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif; background: #f7f9fa; color: #16213a; display: grid; place-items: center; min-height: 100vh; }
    main { max-width: 26rem; margin: 1rem; padding: 1.5rem; background: #fff; border: 1px solid #e3e8ee; border-radius: 12px; }
    h1 { margin: 0 0 .5rem; font-size: 1.25rem; color: #0e5c52; }
    p { margin: .5rem 0; line-height: 1.6; font-size: .95rem; }
    button { margin-top: .75rem; padding: .6rem 1rem; border: 0; border-radius: 8px; background: #0e5c52; color: #fff; font-weight: 700; font-size: .95rem; }
    small { color: #5b6675; }
  </style>
</head>
<body>
  <main>
    <h1>인터넷에 연결되어 있지 않습니다</h1>
    <p>공고와 일정은 인터넷에 연결된 상태에서만 불러올 수 있습니다. 연결을 확인한 뒤 다시 시도해 주세요.</p>
    <p><small>오프라인 화면은 이 안내 페이지만 저장합니다. 공고·북마크·로그인 응답은 오프라인용으로 저장하지 않습니다(로그인 상태와 알림 구독은 이 기기의 브라우저에 남아 있을 수 있으며, 로그아웃하면 정리됩니다). 접수 일정은 연결 후 공식 공고와 함께 확인하세요.</small></p>
    <button type="button" onclick="location.reload()">다시 시도</button>
  </main>
</body>
</html>
